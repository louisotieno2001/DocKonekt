        <script defer>
            document.addEventListener('DOMContentLoaded', async function () {
                const blogTitleElement = document.getElementById('blog-title');
                const blogBodyElement = document.getElementById('blog-body');
                const timeElement = document.getElementById('time');
                const dateElement = document.getElementById('date');
                const menuIcon = document.getElementById('menu_icon');
                const menuItems = document.getElementById('menu-items');

                console.log(blogTitleElement,blogBodyElement,timeElement,dateElement)

                menuIcon.addEventListener('click', function () {
                    menuItems.classList.toggle('show');
                });

                try {
                    const response = await fetch('/api/blog-content');

                   // console.log(response);

                    if (response.ok) {
                        const blogContent = await response.json();

                        // Update the DOM with the fetched blog content
                        blogTitleElement.innerHTML = `<h1>${blogContent.title}</h1>`;
                        blogBodyElement.innerHTML = `<p>${blogContent.body}</p>`;
                        timeElement.innerHTML = `<p>Time updated: ${blogContent.time}</p>`;
                        dateElement.textContent = `<p>Date updated: ${blogContent.date}</p>`;

                    } else {
                        console.error('Error fetching blog content:', error);
                    }

                } catch (error) {
                    console.error('Error fetching blog content:', error);
                    window.confirm("Can't fetch content from the server");
                }
            });
        </script>
