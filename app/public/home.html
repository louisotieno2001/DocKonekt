<body>
    <div class="top_bar">
        <img src="./res/Picture4.png" alt="logo" class="logo">
        <ul class="menu-items" id="menu-items">
            <li><a href="home.html" title="Home page">Home</a></li>
            <li><a href="/blogs" title="Blogs page">Health Blog</a></li>
            <li><a href="about_us.html" title="Learn more about us">About Us</a></li>

        <img src="./res/menu_icon.png" alt="menu_icon" class="menu_icon" id="menu_icon">
        <div class="profile" id="profile">
            <img src="./res/profile.jpg" alt="Profile image">
        </div>
    </div>
    <div class="home-display">
        <div class="search">
        <h2>Welcome to DocKonekt.</h2>
        <p>Search for your hospital below or scroll down to pick a hospital.</p>
        <!-- Inside the search div -->
        <input type="text" placeholder="Search hospital" id="searchInput" oninput="searchHospitals()">
        <button class="button-65" role="button" id="searchButton">Search</button>
        <ul id="suggestions" class="suggestions"></ul>
    </div>
    </div>
    <ul id="hospitalList" class="hospitalList"></ul>
    <div class="bottom_bar">
        <footer class="footer">
            <center><p>Follow us on social media below</p></center>
            <div class="socials">
                <li class="socials_lin"><a href="https://www.linkedin.com/in/dockonekt-dcofficial-3892062bb/" target="_blank"><img src="res/linkedin.png" alt="LinkedIn"></a></li>
                <li class="socials_fb"><a href="https://www.facebook.com/profile.php?id=61551541325742" target="_blank"><img src="res/Facebook.png" alt="Facebook"></a></li>
                <li class="socials_ig"><a href="https://www.instagram.com/futurion_labs123/" target="_blank"><img src="res/Instagram.png" alt="Instagram"></a></li>
                <li class="socials_wa"><a href="https://wa.me/254746852485" target="_blank"><img src="res/icon-whatsapp.webp" alt="Whatsapp"></a></li>
                <li class="socials_tw"><a href="https://twitter.com/doconektoficial" target="_blank"><img src="res/x.jpg" alt="twitter"></a></li>
            </div>
            <p>Copyright&copy;2024 Made at <a href="https://futurionlab.com"> Futurion Labs</a>. All rights reserved</p>
        </footer> 
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const menuIcon = document.getElementById('menu_icon');
                const menuItems = document.getElementById('menu-items');
        
                menuIcon.addEventListener('click', function () {
                menuItems.classList.toggle('show');
                });

                async function fetchHospitals() {
                    try {
                        const response = await fetch('/hospitals');
                        const data = await response.json();
            
                        const hospitalList = document.getElementById('hospitalList');
                        data.forEach(hospital => {
                            const listItem = document.createElement('li');
                            const anchor = document.createElement('a');
                            
                            anchor.textContent = `${hospital.hospital_name}`;
                            anchor.href = hospital.hospital_url; // Set the actual URL
                            anchor.target = '_blank'; // Open the link in a new tab/window
                            anchor.rel = 'noopener noreferrer'; 
            
                            listItem.appendChild(anchor);
                            hospitalList.appendChild(listItem);
                        });
                    } catch (error) {
                        console.error('Error fetching hospitals:', error);
                    }
                }

                fetchHospitals();
 
                const searchInput = document.querySelector('input[type="text"]');
                const searchButton = document.querySelector('button.button-65');
                const hospitalList = document.getElementById('hospitalList');
        
                searchButton.addEventListener('click', async () => {
                    const query = searchInput.value.trim();
        
                    if (query) {
                        try {
                            const response = await fetch('/search-hospitals', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({ query }),
                            });
        
                            const results = await response.json();
        
                            // Clear previous search results
                            hospitalList.innerHTML = '';
        
                            // Display search results
                            results.forEach(hospital => {
                                const listItem = document.createElement('li');
                                const anchor = document.createElement('a');
        
                                anchor.textContent = `${hospital.item.hospital_name}`;
                                anchor.href = hospital.item.hospital_url; // Set the actual URL
                                anchor.target = '_blank'; // Open the link in a new tab/window
                                anchor.rel = 'noopener noreferrer';
        
                                listItem.appendChild(anchor);
                                hospitalList.appendChild(listItem);
                            });
                        } catch (error) {
                            console.error('Error searching hospitals:', error);
                        }
                    }
                });  
                
                const profile = document.getElementById('profile');

                profile.addEventListener('click', async (e) =>{
                    window.location.href='profile';
                })
            });
        </script>
    </div>
</body>
</html>
