<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/small-devices.css">
    <link rel="icon" href="./res/Picture4.png" type="image/x-icon">
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Welcome to DocKonekt. Search for your hospital below or scroll down to pick a hospital.">
    <meta name="keywords" content="DocKonekt, hospital, health, search">
    <meta name="author" content="Futurion Labs">

    <!-- Open Graph Protocol for Social Media Sharing -->
    <meta property="og:title" content="DocKonekt">
    <meta property="og:description"
        content="Welcome to DocKonekt. Search for your hospital below or scroll down to pick a hospital.">
    <meta property="og:image" content="https://dockonekt.com/app/public/res/Picture4.png">
    <meta property="og:url" content="https://dockonekt.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card for Twitter Sharing -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@louiso_chieng1">
    <meta name="twitter:title" content="DocKonekt">
    <meta name="twitter:description"
        content="Welcome to DocKonekt. Search for your hospital below or scroll down to pick a hospital.">
    <meta name="twitter:image" content="https://dockonekt.com/app/public/res/Picture4.png">
    <style>
        /* CSS */
        .button-9 {
            appearance: button;
            backface-visibility: hidden;
            background-color: #405cf5;
            border-radius: 6px;
            border-width: 0;
            box-shadow: rgba(50, 50, 93, .1) 0 0 0 1px inset, rgba(50, 50, 93, .1) 0 2px 5px 0, rgba(0, 0, 0, .07) 0 1px 1px 0;
            box-sizing: border-box;
            color: #fff;
            cursor: pointer;
            font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, sans-serif;
            font-size: 100%;
            height: 44px;
            line-height: 1.15;
            margin: 12px 0 0;
            outline: none;
            overflow: hidden;
            padding: 0 25px;
            position: relative;
            text-align: center;
            text-transform: none;
            transform: translateZ(0);
            transition: all .2s, box-shadow .08s ease-in;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 50%;
        }

        .button-9:disabled {
            cursor: default;
        }

        .button-9:focus {
            box-shadow: rgba(50, 50, 93, .1) 0 0 0 1px inset, rgba(50, 50, 93, .2) 0 6px 15px 0, rgba(0, 0, 0, .1) 0 2px 2px 0, rgba(50, 151, 211, .3) 0 0 0 4px;
        }

        .user-type {
            margin: 50px;
            padding: 0;
            background-color: rgb(34, 36, 51);
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fafafa;
            border-radius: 5px;
            margin-left: 240px;
            margin-right: 240px;
        }

        .user-type button {
            margin: 10px;
        }

        @media (max-width: 1068px) {
            .user-type {
                margin: 20px;
                margin-top: 70px;
                padding: 0;
                background-color: rgb(34, 36, 51);
                height: 500px;
                display: flex;
                border-radius: 5px;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: #fafafa;
            }
        }
    </style>
</head>

<body>
    <div class="user-type">
       <center><h1>Welcome To Dockonekt Pharmacy</h1></center>
        <button class="button-9" role="button" class="patient-btn" id="patient-btn">Patient</button>
        <button class="button-9" role="button" class="pharmacist-btn" id="pharmacist-btn">Pharmacist</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const patientButton = document.getElementById('patient-btn');
            const pharmacistButton = document.getElementById('pharmacist-btn');

            patientButton.addEventListener('click', async (e)=>{
                e.preventDefault();
                window.location.href='pharmacies.html';
            });

            pharmacistButton.addEventListener('click', async (e)=>{
                e.preventDefault();
                window.location.href='registerpharmacy.html';
            });

        });
    </script>
</body>

</html>
